name: Model list

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # the deploy job lists this run's artifacts before deploying; naming any permission here
  # sets every unlisted one to none, so actions: read has to be asked for explicitly
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Check the catalog and build the page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # a run where no upstream answers fails here and the last published list stays up
      - name: Build the page
        run: npx tsx scripts/models-page.ts site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # deploy-pages locates the artifact by listing the run's artifacts and sometimes sees an
  # empty list moments after a successful upload (deploy-pages#451). no upload-to-listing gap
  # separated the passing runs from the failing ones here, so the wait below, not the job
  # boundary, is what makes the result independent of that timing. the split keeps deploy
  # re-runnable on its own: re-running failed jobs reruns only this job, so publish does not
  # upload a second github-pages artifact into the same run.
  deploy:
    name: Publish to Pages
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Wait until the uploaded artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          listed=0
          unreadable=0
          for attempt in $(seq 1 30); do
            # a failed call must retry, not end the job: without the fallback the
            # step's -e would treat a momentary API error as a permanent one
            count=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' || echo "")
            if [ -z "$count" ]; then
              unreadable=$((unreadable + 1))
            elif [ "$count" -ge 1 ]; then
              echo "github-pages artifact is listed (attempt $attempt)"
              listed=1
              break
            fi
            sleep 5
          done
          if [ "$listed" -ne 1 ]; then
            echo "the github-pages artifact was not listed in 30 attempts, $unreadable of which could not read the artifact list" >&2
            exit 1
          fi

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
