services:
  bansos:
    build: .
    image: bansos-router:latest
    container_name: bansos
    restart: unless-stopped
    ports:
      # use "127.0.0.1:17070:17070" to keep it reachable from this machine only
      - "17070:17070"
    environment:
      # every request must send this key; compose refuses to start without it
      BANSOS_API_KEY: ${BANSOS_API_KEY:?set BANSOS_API_KEY (e.g. openssl rand -base64 32)}
    volumes:
      # persist state.json, relay-state.json, logs across restarts (the image runs as `bun`)
      - bansos-data:/home/bun/.bansos
    # override port/bind here if needed; bind must stay 0.0.0.0 inside the container
    # command: ["bun", "dist/cli/index.js", "daemon", "--bind", "0.0.0.0", "--port", "17070"]

volumes:
  bansos-data:
